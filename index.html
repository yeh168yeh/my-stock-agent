<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <title>XQ 選股多重共振分析｜深色科技風</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root{--bg:#0b0f14;--panel:#121826;--card:#0f1a2b;--muted:#8ba3b8;--text:#e6f0ff;--accent:#35c0ff;--accent2:#7bffb7;--warn:#ff8a65;--ok:#38f18a;--glow:0 0 12px rgba(53,192,255,.35);--radius:14px;}
    html,body{height:100%;margin:0;}
    body{background:radial-gradient(1200px 600px at 80% -10%,rgba(53,192,255,.08),transparent 60%),radial-gradient(900px 500px at -10% 10%,rgba(123,255,183,.06),transparent 60%),linear-gradient(180deg,#0a0e13 0%,#0b1016 60%,#0b0f14 100%);color:var(--text);font:14px/1.6 -apple-system,BlinkMacSystemFont,sans-serif;letter-spacing:.2px;}
    .wrap{max-width:1100px;margin:0 auto;padding:32px 16px 80px}
    header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 18px;margin-bottom:18px;border-radius:var(--radius);background:rgba(17,26,41,.9);border:1px solid rgba(81,143,197,.2);box-shadow:var(--glow);}
    h1{font-size:18px;margin:0}
    .sub{color:var(--muted);font-size:12px;margin-top:-2px}
    .hint{color:#b2c7d9;font-size:11px;padding:6px 10px;border-radius:9px;background:rgba(23,36,54,.7);border:1px dashed rgba(97,157,210,.35)}
    .uploader{margin:18px 0 20px;padding:18px;border-radius:var(--radius);background:rgba(14,22,36,.85);border:1px solid rgba(81,143,197,.2)}
    .row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
    input[type=file]{background:#0c1726;color:var(--text);border:1px solid rgba(81,143,197,.28);border-radius:10px;padding:8px 12px;cursor:pointer}
    .btn{background:linear-gradient(90deg,#1a87ff,#13c6aa);color:#051019;border:0;border-radius:10px;padding:10px 16px;font-weight:700;box-shadow:0 4px 12px rgba(53,192,255,.2);cursor:pointer}
    .btn:disabled{opacity:.35;cursor:not-allowed}
    .note{margin-top:8px;color:#b0c4d4;font-size:12px}
    .error{color:var(--warn);font-weight:600}
    .grid{display:grid;grid-template-columns:1.2fr 1fr;gap:16px}
    @media (max-width:980px){.grid{grid-template-columns:1fr}}
    .card{background:rgba(15,26,43,.95);border:1px solid rgba(81,143,197,.22);border-radius:var(--radius);padding:16px}
    .card h2{font-size:15px;margin:0 0 12px;color:var(--accent)}
    .tag{display:inline-flex;padding:3px 8px;border-radius:6px;font-size:11px;margin-right:6px}
    .tag.ok{background:rgba(56,241,138,.1);color:var(--ok);border:1px solid rgba(56,241,138,.3)}
    .tag.hot{background:rgba(255,138,101,.1);color:var(--warn);border:1px solid rgba(255,138,101,.3)}
    .tag.ms{background:rgba(53,192,255,.08);color:var(--accent);border:1px solid rgba(53,192,255,.2)}
    .pick{display:flex;flex-direction:column;gap:10px}
    .pick .title{font-size:18px;font-weight:800;color:var(--accent)}
    .kv{display:flex;flex-wrap:wrap;gap:8px;color:#cfe3f7;margin-top:4px}
    .kv .cell{background:#0b1523;border:1px solid rgba(81,143,197,.2);padding:6px 10px;border-radius:8px;font-size:13px}
    .desc{margin-top:6px;padding:12px;border-radius:12px;background:rgba(10,22,38,.9);border:1px solid rgba(81,143,197,.2);color:#d6e6f6;white-space:pre-line}
    table{width:100%;border-collapse:separate;border-spacing:0 6px}
    thead th{font-size:12px;color:#a7bed0;padding:8px 10px;text-align:left}
    tbody tr{background:rgba(11,21,34,.9)}
    tbody td{padding:10px;border-top:1px solid rgba(81,143,197,.1);border-bottom:1px solid rgba(81,143,197,.1)}
    tbody tr td:first-child{border-left:1px solid rgba(81,143,197,.1);border-radius:8px 0 0 8px}
    tbody tr td:last-child{border-right:1px solid rgba(81,143,197,.1);border-radius:0 8px 8px 0}
    tr.highlight{outline:1px solid rgba(53,192,255,.4);background:rgba(15,32,54,.6)}
    .mono{font-variant-numeric:tabular-nums;font-family:monospace;color:#d7f2ff}
    .muted{color:#9fb4c5;text-align:center;padding:20px}
    footer{margin-top:28px;color:#7e98ad;font-size:11px;text-align:center}
    .blink{position:relative;padding-left:16px}
    .blink::before{content:"";position:absolute;left:0;top:6px;width:8px;height:8px;border-radius:50%;background:#ff8a65;animation:bk 1.2s infinite}
    @keyframes bk{0%,100%{opacity:.3}50%{opacity:1}}
    .hide{display:none}
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="brand">
        <div>
          <h1>🐙 XQ 選股多重共振分析儀</h1>
          <div class="sub">支援名師【朱】【林】【春】【陳】與盤中點火偵測｜RWD 深色科技風</div>
        </div>
      </div>
      <div class="hint">編碼支援自動對齊解析</div>
    </header>

    <section class="uploader">
      <div class="row">
        <input id="file" type="file" accept=".csv" />
        <button id="btnParse" class="btn" disabled>讀取並分析</button>
        <span id="status" class="note">請選擇從 XQ 匯出的 CSV 檔。</span>
      </div>
      <div id="err" class="note error hide"></div>
    </section>

    <section class="grid">
      <div class="card">
        <h2>🔥 多重共振強勢股（盤中點火優先）</h2>
        <div id="pick" class="pick"><div class="muted">尚未載入資料，請先上傳 CSV 檔案</div></div>
      </div>
      <div class="card">
        <h2>🧠 AI 技術面智能化綜合描述</h2>
        <div id="desc" class="desc">等待數據載入後，系統將自動解析數據結構...</div>
        <div style="margin-top:8px">
          <span class="tag ms">名師共振</span>
          <span class="tag hot">盤中點火</span>
          <span class="tag ok">量價齊揚</span>
        </div>
      </div>
    </section>

    <section class="card" style="margin-top:16px">
      <h2>📊 今日選股完整清單</h2>
      <div style="overflow:auto">
        <table id="table">
          <thead>
            <tr>
              <th>商品/代碼</th>
              <th>名稱</th>
              <th>觸發原因 / 名師</th>
              <th>位階</th>
              <th>建議進場價</th>
              <th>盤中點火</th>
            </tr>
          </thead>
          <tbody id="tbody"><tr><td colspan="6" class="muted">尚未載入資料</td></tr></tbody>
        </table>
      </div>
    </section>
    <footer>策略提示：多重共振優先；進出請搭配風控與盤勢。</footer>
  </div>

  <script>
    const fileInput = document.getElementById('file');
    const btnParse = document.getElementById('btnParse');
    const statusText = document.getElementById('status');
    const errBox = document.getElementById('err');
    const tbody = document.getElementById('tbody');
    const pickDiv = document.getElementById('pick');
    const descDiv = document.getElementById('desc');

    fileInput.addEventListener('change', () => {
      if (fileInput.files.length > 0) {
        btnParse.disabled = false;
        statusText.innerText = `已選取檔案: ${fileInput.files[0].name}`;
        errBox.classList.add('hide');
      } else {
        btnParse.disabled = true;
      }
    });

    btnParse.addEventListener('click', () => {
      const file = fileInput.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        try { processCSV(e.target.result); } 
        catch (err) { showError(`解析失敗: ${err.message}`); }
      };
      reader.onerror = () => showError("檔案讀取失敗。");
      reader.readAsText(file, 'UTF-8');
    });

    function showError(msg) { errBox.innerText = msg; errBox.classList.remove('hide'); }

    function processCSV(csvText) {
      const lines = csvText.split(/\r?\n/).filter(l => l.trim() !== '');
      if (lines.length < 2) { showError("CSV 檔案數據不足"); return; }
      const headers = lines[0].split(',').map(h => h.trim().replace(/^"|"$/g, ''));
      
      let codeIdx = headers.findIndex(h => h.includes("代碼") || h.includes("商品") || h.includes("代號"));
      let nameIdx = headers.findIndex(h => h.includes("名稱") || h.includes("公司"));
      let reasonIdx = headers.findIndex(h => h.includes("原因") || h.includes("名師") || h.includes("觸發"));
      let positionIdx = headers.findIndex(h => h.includes("位階"));
      let priceIdx = headers.findIndex(h => h.includes("進場") || h.includes("價"));
      let fireIdx = headers.findIndex(h => h.includes("點火") || h.includes("雷達") || h.includes("連動"));

      if (codeIdx === -1) codeIdx = 0;
      if (nameIdx === -1) nameIdx = headers.length > 1 ? 1 : 0;
      if (reasonIdx === -1) reasonIdx = headers.length > 3 ? 3 : 2;
      if (positionIdx === -1) positionIdx = headers.length > 2 ? 2 : 1;
      if (priceIdx === -1) priceIdx = headers.length > 4 ? 4 : 3;
      if (fireIdx === -1) fireIdx = headers.length > 5 ? 5 : headers.length - 1;

      tbody.innerHTML = ''; pickDiv.innerHTML = '';
      let strongStocks = [], totalCount = 0;
      let summary = { zhu: 0, lin: 0, yan: 0, chen: 0, fire: 0 };

      for (let i = 1; i < lines.length; i++) {
        const cols = lines[i].split(',').map(c => c.trim().replace(/^"|"$/g, ''));
        if (cols.length < 2) continue;

        let code = cols[codeIdx] || "—", name = cols[nameIdx] || "—", reason = cols[reasonIdx] || "—";
        let position = cols[positionIdx] || "—", price = cols[priceIdx] || "—", fire = cols[fireIdx] || "—";

        if (code && name === "—" && code.includes(" ")) {
          const parts = code.split(" "); code = parts[0]; name = parts[1];
        }
        totalCount++;
        let matchCount = 0;
        if (reason.includes("朱")) { matchCount++; summary.zhu++; }
        if (reason.includes("林")) { matchCount++; summary.lin++; }
        if (reason.includes("春")) { matchCount++; summary.yan++; }
        if (reason.includes("陳")) { matchCount++; summary.chen++; }

        const isFired = fire.includes("點火") || fire.includes("是") || fire.includes("🔥") || fire.includes("火");
        if (isFired) summary.fire++;

        const isHighlight = matchCount >= 2 || (matchCount >= 1 && isFired);
        if (isHighlight) strongStocks.push({ code, name, reason, position, fire, price });

        const tr = document.createElement('tr');
        if (isHighlight) tr.className = "highlight";
        tr.innerHTML = `
          <td class="mono">${code}</td>
          <td style="font-weight:600; color:#35c0ff;">${name}</td>
          <td><span style="color:#facc15">${reason}</span></td>
${position}${price}${fire}`;tbody.appendChild(tr);}if (strongStocks.length > 0) {strongStocks.forEach(s => {const item = document.createElement('div');item.innerHTML = <div class="title">🚀 ${s.name} (${s.code})</div><div class="kv"><span class="cell">策略: <b style="color:#facc15">${s.reason}</b></span><span class="cell">位階: <b style="color:#7bffb7">${s.position}</b></span><span class="cell">進場: <b style="color:#7bffb7">${s.price}</b></span><span class="cell">狀態: <b style="color:#ff8a65">${s.fire}</b></span></div>;pickDiv.appendChild(item);});} else {pickDiv.innerHTML = '今日未偵測到符合多重共振或點火之強勢股';}let report = 【自動化技術面結構報告】\n今日共篩選出 ${totalCount} 檔個股。\n\n;if (strongStocks.length > 0) {report += 🔥 核心焦點：系統成功鎖定 ${strongStocks.length} 檔滿足「多重共振」架構之強勢標的。技術面凝聚了複合名師策略認證，盤中釋放動能攻擊訊號。\n\n;} else {report += 📈 盤勢結構：今日盤面表現相對分散，個股未出現多重指標強烈共振。整體多頭動能處於零星點火狀態。\n\n;}report += 🎯 策略統計：\n- 朱家鴻: ${summary.zhu} 檔 | - 林穎: ${summary.lin} 檔\n- 春燕: ${summary.yan} 檔 | - 陳重銘: ${summary.chen} 檔\n- 盤中已點火個股: ${summary.fire} 檔。\n\n建議優先留意共振強勢股的防守力道，低位或中位更具防禦優勢。;descDiv.innerText = report;statusText.innerText = "分析完成！已成功解碼 XQ 數據。";}
